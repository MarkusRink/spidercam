name: CI

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install native deps
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev

      - name: Go vet
        run: go vet ./...

      - name: Go unit tests
        run: go test ./internal/... -race -count=1 -tags spidercam_native_capture

      - name: Go E2E tests
        run: go test ./test/e2e/... -tags=e2e -count=1

      - name: Install JS dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check
        run: npm run check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: UI tests
        run: npm run test:ui
        env:
          CI: "true"
